<!DOCTYPE html>
<html lang="pl">
<head>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <meta charset="UTF-8">
    <title>Chat</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background-color: #f0f0f0;
        }

        .profile {
            cursor: pointer;
            position: relative;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 30px;
            background: white;
            border: 1px solid #ccc;
            padding: 5px;
        }

            .dropdown button {
                background: none;
                border: none;
                cursor: pointer;
                padding: 5px;
                width: 100%;
                text-align: left;
            }

        /* ========================
           Dzień 5
           Lista czatów i modal
        ======================== */
        .chat-container {
            display: flex;
            padding: 20px;
            height: calc(100vh - 50px);
        }

        .chat-list {
            width: 200px;
        }

            .chat-list h2 {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .chat-list ul {
                list-style: none;
                padding: 0;
            }

            .chat-list li {
                margin-bottom: 5px;
            }

            .chat-list button.chat-btn {
                width: 100%;
                padding: 5px;
                cursor: pointer;
            }

        /* Modal okienko */
        .modal {
            display: none; /* ukryty domyślnie */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            width: 400px;
            max-height: 80%;
            overflow-y: auto;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }

        .user-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin: 10px 0;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        /*========================
           Dzień 6
           Okno czatu
        ======================== */

        .chat-window {
            flex: 1;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 5px;
        }

        .chat-window {
            flex: 1;
            margin-left: 20px;
            display: none; /* <-- ukryte domyślnie */
            flex-direction: column;
            height: 100%;
        }

    </style>
</head>
<body>

    <div class="topbar">
        <div class="profile" onclick="toggleMenu()">
            👤 Zalogowany jako: <strong>{{ user }}</strong>
            <div class="dropdown" id="menu">
                <button onclick="logout()">Wyloguj</button>
            </div>
        </div>
    </div>

    <!-- ========================
            Dzień 5
            Lista czatów + przycisk +
       ======================== -->
    <div class="chat-container">
        <div class="chat-list">
            <h2>
                Lista czatów
                <button onclick="openModal()">+</button>
            </h2>
            <ul id="chatList"></ul>
        </div>
        <!-- ========================
            Dzień 6 
            Okno czatu + input + przycisk wyślij
       ======================== -->
        
        <div class="chat-window" id="chatWindow">
            <div id="messages">
            </div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
                <button onclick="sendMessage()">➡️</button>
            </div>
        </div>

        <!-- Tutaj będzie okienko modal do tworzenia czatu -->
        <div class="modal" id="chatModal">
            <div class="modal-content">
                <label>
                    Nazwa czatu:
                    <input type="text" id="chatName" placeholder="Nazwa czatu">
                </label>

                

                <div class="user-list" id="userList">
                    <!-- Lista użytkowników dynamicznie -->
                </div>

                <div class="modal-footer">
                    <button onclick="createChat()">Utwórz czat</button>
                    <button onclick="closeModal()">Anuluj</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        function toggleMenu() {
            const menu = document.getElementById("menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        async function logout() {
            await fetch("/logout");
            alert("Zostałeś wylogowany");
            window.location.href = "/login";
        }

       
        // Dzień 5
        // Modal tworzenia czatu
       
        const modal = document.getElementById("chatModal");
        const chatList = document.getElementById("chatList");
        const userList = document.getElementById("userList");
        //const userSearch = document.getElementById("userSearch");
        const chatNameInput = document.getElementById("chatName");

        function openModal() {
            modal.style.display = "flex";
            loadUsers();
        }

        function closeModal() {
            modal.style.display = "none";
            chatNameInput.value = "";
            //userSearch.value = "";
            userList.innerHTML = "";
        }

        // Pobranie listy wszystkich użytkowników 
        async function loadUsers() {
            const res = await fetch("/api/users");
            const users = await res.json();
            userList.innerHTML = "";
            users.forEach(user => {
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML = `
                    <span>${user.username}</span>
                    <button onclick="toggleSelect(this, ${user.id})">+</button>
                `;
                userList.appendChild(div);
            });
        }

        const selectedUsers = new Set();
        function toggleSelect(btn, userId) {
            if (selectedUsers.has(userId)) {
                selectedUsers.delete(userId);
                btn.textContent = "+";
            } else {
                selectedUsers.add(userId);
                btn.textContent = "✓";
            }
        }

        // Tworzenie czatu
        async function createChat() {
            const name = chatNameInput.value;
            if (!name || selectedUsers.size === 0) {
                alert("Podaj nazwę czatu i wybierz przynajmniej jednego użytkownika");
                return;
            }

            const res = await fetch("/api/chats", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name,
                    user_ids: Array.from(selectedUsers)
                })
            });

            if (res.ok) {
                closeModal();
                await loadChats();
                
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        // Pobieranie listy czatów
        async function loadChats() {
            const res = await fetch("/api/chats");
            const chats = await res.json();
            chatList.innerHTML = "";
            chats.forEach(chat => {
                const btn = document.createElement("button");
                btn.className = "chat-btn";
                btn.textContent = chat.name;
                // ========================
                // Dzień 6
                // Obsługa kliknięcia czatu i ładowanie wiadomości
                // ========================
                
                btn.onclick = () => joinChat(chat.id);

                

              
                chatList.appendChild(btn);
            });
        }

        loadChats();
        // ========================
        // Dzień 6
        // Funkcje wysyłania i pobierania wiadomości
        // ========================
        
        let currentChatId = null;
        const messagesDiv = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");

        async function loadMessages() {
            if (!currentChatId) return;
            const res = await fetch(`/api/messages/${currentChatId}`);
            const msgs = await res.json();

            messagesDiv.innerHTML = "";
            msgs.forEach(m => {
                const div = document.createElement("div");
                div.textContent = `[${m.timestamp}] ${m.user}: ${m.content}`;
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentChatId) return;

            const res = await fetch("/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: currentChatId, content })
            });

            if (res.ok) {
                messageInput.value = "";
                loadMessages();
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        
        

        // Połączenie z Socket.IO
        const socket = io();  // domyślnie 127.0.0.1:5000

        // Funkcja dołączania do pokoju czatu
        async function joinChat(chatId) {
            currentChatId = chatId;
            messagesDiv.innerHTML = ""; // wyczyść okno
            document.getElementById("chatWindow").style.display = "flex"; // pokaż okno
            socket.emit("join", { chat_id: chatId });
            await loadMessages(); // załaduj historię
        }

        // Nasłuchiwanie nowych wiadomości w czasie rzeczywistym
        socket.on("receive_message", (data) => {
            if (currentChatId === data.chat_id) { // tylko w aktualnym czacie
                const div = document.createElement("div");
                div.textContent = `[${data.timestamp}] ${data.user}: ${data.content}`;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        });

        // Zmieniamy funkcję sendMessage, aby wysyłała przez Socket.IO
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentChatId) return;

            socket.emit("send_message", {
                chat_id: currentChatId,
                content: content
            });

            messageInput.value = "";
        }

    </script>

</body>
</html>
