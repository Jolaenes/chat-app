<!DOCTYPE html>
<html lang="pl">
<head>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta charset="UTF-8">
    <title>Chat</title>
   
</head>
<body>

    <div class="topbar">
        <div class="profile" onclick="toggleMenu()">
            👤 Zalogowany jako: <strong>{{ user }}</strong>
            <div class="dropdown" id="menu">
                <button onclick="logout()">Wyloguj</button>
            </div>
        </div>
    </div>

    <!-- ========================
            Dzień 5
            Lista czatów + przycisk +
       ======================== -->
    <div class="chat-container">
        <div class="chat-list">
            <h2>
                Lista czatów
                <button onclick="openModal()">+</button>
            </h2>
            <ul id="chatList"></ul>
        </div>
        <!-- ========================
            Dzień 6 
            Okno czatu + input + przycisk wyślij
       ======================== -->
        
        <div class="chat-window" id="chatWindow">
            <div id="messages">
            </div>
            <div style="display: flex; gap: 5px; align-items: stretch;">
                <div class="input-wrapper">
                    <span class="input-prefix">\{{ user }}></span>
                    <input type="text" id="messageInput" placeholder="" autocomplete="off">
                </div>
                <button onclick="sendMessage()">-></button>

            </div>
        </div>
        <!-- Tutaj będzie okienko modal do tworzenia czatu -->
        <div class="modal" id="chatModal">
            <div class="modal-content">
                <label>
                    Nazwa czatu:
                    <input type="text" id="chatName" placeholder="Nazwa czatu">
                </label>

                

                <div class="user-list" id="userList">
                    <!-- Lista użytkowników dynamicznie -->
                </div>

                <div class="modal-footer">
                    <button onclick="createChat()">Utwórz czat</button>
                    <button onclick="closeModal()">Anuluj</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        function toggleMenu() {
            const menu = document.getElementById("menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        async function logout() {
            await fetch("/logout");
            alert("Zostałeś wylogowany");
            window.location.href = "/login";
        }

       
        // Dzień 5
        // Modal tworzenia czatu
       
        const modal = document.getElementById("chatModal");
        const chatList = document.getElementById("chatList");
        const userList = document.getElementById("userList");
        //const userSearch = document.getElementById("userSearch");
        const chatNameInput = document.getElementById("chatName");

        function openModal() {
            modal.classList.add("active");
            loadUsers();
        }

        function closeModal() {
            modal.classList.remove("active");
            chatNameInput.value = "";
            //userSearch.value = "";
            userList.innerHTML = "";
            selectedUsers.clear();
        }

        // Pobranie listy wszystkich użytkowników 
        async function loadUsers() {
            const res = await fetch("/api/users");
            const users = await res.json();
            userList.innerHTML = "";
            users.forEach(user => {
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML = `
                    <span>${user.username}</span>
                    <button onclick="toggleSelect(this, ${user.id})">+</button>
                `;
                userList.appendChild(div);
            });
        }

        const selectedUsers = new Set();
        function toggleSelect(btn, userId) {
            if (selectedUsers.has(userId)) {
                selectedUsers.delete(userId);
                btn.textContent = "+";
            } else {
                selectedUsers.add(userId);
                btn.textContent = "✓";
            }
        }

        // Tworzenie czatu
        async function createChat() {
            const name = chatNameInput.value;
            if (!name || selectedUsers.size === 0) {
                alert("Podaj nazwę czatu i wybierz przynajmniej jednego użytkownika");
                return;
            }

            const res = await fetch("/api/chats", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name,
                    user_ids: Array.from(selectedUsers)
                })
            });

            if (res.ok) {
                closeModal();
                await loadChats();
                
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        // Pobieranie listy czatów
        async function loadChats() {
            const res = await fetch("/api/chats");
            const chats = await res.json();
            chatList.innerHTML = "";
            chats.forEach(chat => {
                const btn = document.createElement("button");
                btn.className = "chat-btn";
                btn.textContent = chat.name;
                // ========================
                // Dzień 6
                // Obsługa kliknięcia czatu i ładowanie wiadomości
                // ========================
                
                btn.onclick = () => joinChat(chat.id);

                

              
                chatList.appendChild(btn);
            });
        }

        loadChats();
        // ========================
        // Dzień 6
        // Funkcje wysyłania i pobierania wiadomości
        // ========================
        
        let currentChatId = null;
        const messagesDiv = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");

        async function loadMessages() {
            if (!currentChatId) return;
            const res = await fetch(`/api/messages/${currentChatId}`);
            const msgs = await res.json();

            messagesDiv.innerHTML = "";
            msgs.forEach(m => {
                const div = document.createElement("div");
                div.textContent = `[${m.timestamp}]\\${m.user}> ${m.content}`;
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentChatId) return;

            const res = await fetch("/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: currentChatId, content })
            });

            if (res.ok) {
                messageInput.value = "";
                loadMessages();
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }

        
        

        // Połączenie z Socket.IO
        const socket = io();  // domyślnie 127.0.0.1:5000

        // Funkcja dołączania do pokoju czatu
        async function joinChat(chatId) {
            currentChatId = chatId;
            messagesDiv.innerHTML = ""; // wyczyść okno
            document.getElementById("chatWindow").style.display = "flex"; // pokaż okno
            socket.emit("join", { chat_id: chatId });
            await loadMessages(); // załaduj historię
        }

        // Nasłuchiwanie nowych wiadomości w czasie rzeczywistym
        socket.on("receive_message", (data) => {
            if (currentChatId === data.chat_id) { // tylko w aktualnym czacie
                const div = document.createElement("div");
                div.textContent = `[${data.timestamp}]\\${data.user}> ${data.content}`;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        });

        // Zmieniamy funkcję sendMessage, aby wysyłała przez Socket.IO
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentChatId) return;

            socket.emit("send_message", {
                chat_id: currentChatId,
                content: content
            });

            messageInput.value = "";
        }

    </script>

</body>
</html>
